name: Build sync-server

on:
  push:
    branches: [main]
    paths: [.github/**, sync-server/**]
  pull_request:
    branches: [main]
    paths: [.github/**, sync-server/**]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract image version
        id: image_version
        run: |
          VERSION=$(node -p "require('./sync-server/package.json').version")
          echo "found version $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push sync-server
        uses: docker/build-push-action@v7
        with:
          context: sync-server
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/antoncuranz/kompass/sync-server:latest
            ghcr.io/antoncuranz/kompass/sync-server:${{ steps.image_version.outputs.version }}
