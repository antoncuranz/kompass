name: Build server-worker

on:
  push:
    branches: [main]
    paths: [.github/**, server-worker/**]
  pull_request:
    branches: [main]
    paths: [.github/**, server-worker/**]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: ./server-worker

      - name: Run linter
        run: bun lint
        working-directory: ./server-worker

      - name: Run tests
        run: bun run test
        working-directory: ./server-worker

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Docker Hardened Images
        uses: docker/login-action@v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: server-worker
          load: true
          tags: kompass-ci:server-worker

      - name: Generate SBOM and scan image
        uses: ./.github/actions/scan-image
        with:
          image: kompass-ci:server-worker
          name: server-worker
          vex-image: bun

      - name: Push image
        if: github.event_name == 'push'
        env:
          IMAGE_SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker tag kompass-ci:server-worker ghcr.io/antoncuranz/kompass/server-worker:latest
          docker tag kompass-ci:server-worker "ghcr.io/antoncuranz/kompass/server-worker:$IMAGE_SHA"
          docker push ghcr.io/antoncuranz/kompass/server-worker:latest
          docker push "ghcr.io/antoncuranz/kompass/server-worker:$IMAGE_SHA"
