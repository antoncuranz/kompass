name: Build Transportation API

on:
  push:
    branches: [main]
    paths: [.github/**, transportation-api/**]
  pull_request:
    branches: [main]
    paths: [.github/**, transportation-api/**]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Run integration tests
        working-directory: ./transportation-api
        run: go test -v ./integration-test/...

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Docker Hardened Images
        uses: docker/login-action@v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: transportation-api
          load: true
          tags: kompass-ci:transportation-api

      - name: Generate SBOM and scan image
        uses: ./.github/actions/scan-image
        with:
          image: kompass-ci:transportation-api
          name: transportation-api

      - name: Push image
        if: github.event_name == 'push'
        env:
          IMAGE_SHA: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker tag kompass-ci:transportation-api ghcr.io/antoncuranz/kompass/transportation-api:latest
          docker tag kompass-ci:transportation-api "ghcr.io/antoncuranz/kompass/transportation-api:$IMAGE_SHA"
          docker push ghcr.io/antoncuranz/kompass/transportation-api:latest
          docker push "ghcr.io/antoncuranz/kompass/transportation-api:$IMAGE_SHA"
